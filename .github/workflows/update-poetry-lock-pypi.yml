name: Temporary update Poetry lock for PyPI deps

on:
  push:
    branches:
      - fix/use-pypi-dependencies
    paths:
      - .github/workflows/update-poetry-lock-pypi.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Regenerate lock file
        run: poetry lock
      - name: Commit lock file
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "chore: update poetry lock for PyPI dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
