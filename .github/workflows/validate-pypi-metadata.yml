name: Temporary validate PyPI metadata

on:
  push:
    branches:
      - fix/use-pypi-dependencies
    paths:
      - .github/workflows/validate-pypi-metadata.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Check lock and build wheel
        run: |
          poetry check --lock
          poetry build
      - name: Reject direct Git dependencies in wheel metadata
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = archive.read(metadata_name).decode()

          requirements = [
              line for line in metadata.splitlines() if line.startswith("Requires-Dist:")
          ]
          print("\n".join(requirements))
          if any("git+" in line for line in requirements):
              raise SystemExit("wheel metadata still contains a direct Git dependency")
          PY
