observatory = "OMU1P85M"
location = { lon = "138.472153deg", lat = "35.940874deg", height = "1386m" }
"observation_frequency[GHz]" =  115.271204

simulator = false

alert_interval_sec = 1
record_every_n_spectral_data = 1

[ros]
service_timeout_sec = 10
communication_deadline_sec = 0.01
logging_interval_sec = 2
topic_scan_interval_sec = 1

[antenna]
pid_param_az = [1.0, 0.0, 0.0]
pid_param_el = [1.0, 0.0, 0.0]
drive_range_az = ["-20deg", "400deg"]
drive_range_el = ["10deg", "85deg"]
drive_warning_limit_az = ["-15deg", "380deg"]
drive_warning_limit_el = ["20deg", "80deg"]
drive_critical_limit_az = ["-10deg", "390deg"]
drive_critical_limit_el = ["15deg", "85deg"]
"pointing_accuracy[arcsec]" = 10
pointing_parameter_path = "./pointing_param.toml"
"scan_margin[deg]" = 0.1
"max_acceleration_az[deg s-2]" = 1.6
"max_acceleration_el[deg s-2]" = 1.6
"max_speed_az[deg/s]" = 1.6
"max_speed_el[deg/s]" = 1.6
command_frequency = 50
enc_frequency = 20
command_offset_sec = 1.0
min_buffer_sec = 0.5
max_buffer_sec = 1.5
max_groups_per_convert = 10
command_group_duration_sec = 1

[chopper_motor]
_ = "CPZ7415V"
rsw_id = 0
position = { insert = 4750, remove = 19700 }
start_mode = "const"
low_limit = 0
high_limit = 20000
DI_ch = {ready = "", alarm = "", move = ""}
DO_ch = {zeropoint = 4, brake =  "", stop = "", removealarm = 3}

[antenna_motor]
_ = "CPZ7415V"
rsw_id = 0
useaxes = "xyu"
x_mode = "jog"
y_mode = "jog"
u_mode = "ptp"
x_pulse_conf = { PULSE = 1, OUT = 0, DIR = 0, WAIT = 0, DUTY = 0 }
y_pulse_conf = { PULSE = 1, OUT = 0, DIR = 0, WAIT = 0, DUTY = 0 }
u_pulse_conf = { PULSE = 1, OUT = 1, DIR = 1, WAIT = 0, DUTY = 0 }
x_motion = { clock = 59, acc_mode = "acc_normal", low_speed = 10, speed = 5000, acc = 50, dec = 50, step = 1 }
y_motion = { clock = 59, acc_mode = "acc_normal", low_speed = 10, speed = 5000, acc = 50, dec = 50, step = 1 }
u_motion = { clock = 299, acc_mode = "acc_normal", low_speed = 10, speed = 10000, acc = 50, dec = 50, step = 5000 }
channel = { az = "y", el = "x", chopper = "u" }
speed_to_pulse_factor_az = -200000
speed_to_pulse_factor_el = -200000

[antenna_encoder.az]
_ = "ND287"
port = "/dev/ttyUSB0"

[antenna_encoder.el]
_ = "ND287"
port = "/dev/ttyUSB2"

[antenna_encoder_unwrap.az]
enabled = true
mode = "absolute_modulo"
"period[deg]" = 360.0
"raw_min[deg]" = 0.0
"raw_max[deg]" = 360.0
"zero_offset[deg]" = 0.0
sign = 1
"max_jump[deg]" = 5.0
state_path = "/root/necst_ws/antenna_az_unwrap_state.json"
startup_policy = "recover_if_raw_matches"
startup_discard_raw_out_of_range_samples = 3
"state_heartbeat_sec[s]" = 5.0
"state_warn_age_sec[s]" = 86400.0
"state_raw_tolerance[deg]" = 5.0

[ccd_controller]
_ = "M100"
host = "192.168.100.47"
port = 50000
pointing_param_path = ""
pic_captured_path = "/home/pi/data/optical_pointing"

[signal_generator.band6_1st]
_ = "FSW0020"
host = "192.168.100.52"
port = 10001

[signal_generator.band6_usb_2nd]
_ = "FSW0010"
host = "192.168.100.51"
port = 10001

[signal_generator.band3_1st]
_ = "FSW0020"
host = "192.168.100.54"
port = 10001

[signal_generator.band3_usb_2nd]
_ = "FSW0020"
host = "192.168.100.55"
port = 10001

[signal_generator.band36_lsb_2nd]
_ = "FSW0010"
host = "192.168.100.53"
port = 10001

[power_meter]
_ = "ML2437A"
host = "192.168.100.106"
port = 13

[thermometer]
_ = "Model218"
communicator = "USB"
usb_port = "/dev/ttyUSB0"
channel = { Stage4K1 = 1, Shield40K1 = 2, Shield40K2 = 3, Stage4K2 = 4 }

[weather_station.out]
_ = "TR73U"
port = "/dev/ttyUSB1"

[sis_bias_setter]
_ = "CPZ340816"
rsw_id = 0
channel = { USB = 3, LSB = 4 }
max_mv = [-8, 8]
converter = {USB = "x / 3", LSB = "x/3"}

[sis_bias_reader]
_ = "CPZ3177"
rsw_id = 0
ave_num = 100
smpl_freq = 1000
single_diff = "DIFF"
all_ch_num = 8
ch_range = '5V'
channel = { hemt_ch1_Vdr = 1, hemt_ch1_Vg1 = 2, hemt_ch1_Vg2 = 3, sis_USB_V = 5, sis_LSB_V = 7, sis_USB_I = 6, sis_LSB_I = 8}
converter = [
    { ch = "hemt_ch1_Vdr", func =  "x", units = "V" },
    { ch = "hemt_ch1_Vg1", func =  "x", units = "V" },
    { ch = "hemt_ch1_Vg2", func =  "x", units = "V" },
    { ch = "sis_USB_V", func =  "x * 5", units = "mV" },
    { ch = "sis_USB_I", func =  "x * 500", units = "uA" },
    { ch = "sis_LSB_V", func =  "x * 5", units = "mV" },
    { ch = "sis_LSB_I", func =  "x * 500", units = "uA" },
]

[hemt_bias_reader]
_ = "CPZ3177"
rsw_id = 0

[spectrometer.xffts]
_ = "XFFTS"
host = "localhost"
data_port = 25144
cmd_port = 16210
synctime_us = 100000
bw_MHz = { 1 = 2500, 2 = 2500, 3 = 2500 }  
#bw_MHz = { 1 = 2500 }
max_ch = 32768
record_quesize = 2

[attenuator.band3]
_ = "RHIO10"
host = "192.168.100.25"
port = 6001
channel = { CH1 = 1, CH2 = 2 }

[attenuator.band6]
_ = "RHIO10"
host = "192.168.100.26"
port = 6001
channel = { CH1 = 1, CH2 = 2 }

[local_attenuator]
_ = "CPZ340516"
channel = { 100GHz = 1 }
range = "DA0_100mA"
rate = 0.1
rsw_id = 0

[vacuum_gauge]
_ = "TPG261"
communicator = "LAN"
host = "192.168.100.178"
port = 8000


[progress.time_sync]
enabled = true
interval_sec = 60
timeout_sec = 2.0
ok_offset_ms = 5.0
warn_offset_ms = 20.0
bad_after_failures = 3

hosts = [
  { name = "localhost", host = "localhost", method = "auto" },
  { name = "xffts",     host = "192.168.100.62",     method = "auto" },
  { name = "main",    host = "192.168.100.80",    method = "auto" },
  { name = "FAC RX",    host = "192.168.100.187",    method = "auto" },
  { name = "FAC motor",    host = "192.168.100.198",    method = "auto" },
]

[console.observation_log]
directory = "/root/necst_ws/necst_observation_logs"
prefix = "obslog"
user = "observer"

[console.health]
enabled = true
poll_interval_sec = 2.0

[[console.health.nodes]]
name = "/necst/OMU1P85M/ctrl/antenna/encoder_readout"
label = "Antenna encoder"
class = "manual_mount_required"

[[console.health.nodes]]
name = "/necst/OMU1P85M/ctrl/antenna/motor_driver"
label = "Antenna motor"
class = "manual_mount_required"

[[console.health.nodes]]
name = "/necst/OMU1P85M/ctrl/antenna/controller"
label = "Antenna controller"
class = "manual_mount_required"

[[console.health.nodes]]
name = "/necst/OMU1P85M/ctrl/antenna/altaz_coord"
label = "AltAz coordinate"
class = "manual_mount_required"

[[console.health.nodes]]
name = "/necst/OMU1P85M/rx/spectrometer"
label = "Spectrometer"
class = "manual_mount_required"

[[console.health.nodes]]
name = "/necst/OMU1P85M/core/recorder"
label = "Recorder"
class = "manual_mount_required"

[[console.health.nodes]]
name = "/necst/OMU1P85M/ctrl/calib/chopper"
label = "Chopper"
class = "manual_mount_required"

[[console.health.nodes]]
name = "/necst/OMU1P85M/thermometer_reader"
label = "Weather station"
class = "manual_mount_required"